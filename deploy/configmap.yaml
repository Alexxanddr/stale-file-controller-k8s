apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-recovery
  namespace: storage-recovery
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: Disabled
data:
  state: '{}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-recovery-config
  namespace: storage-recovery
data:
  STORAGE_NAMESPACE: storage-system
  MERGERFS_SELECTOR: app=mergerfs
  NFS_SELECTOR: app=nfs-ganesha
  MERGERFS_CONTAINER: mergerfs
  NFS_CONTAINER: nfs-ganesha
  MERGERFS_PATH: /mnt/merged/data
  NFS_BACKING_PATH: /export/data
  MERGERFS_HOST_PATH: /run/mergerfs
  NFS_SERVER: nfs.storage-system.svc.cluster.local
  NFS_EXPORT_PATH: /data
  EXTRA_PATHS: '[]'
